name: sport_shop
description: "Онлайн-магазин спортивных товаров с ИИ-подбором экипировки"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Управление состоянием (ChangeNotifier + Provider)
  provider: ^6.1.2
  # Локальная база данных SQLite (Android / iOS)
  sqflite: ^2.4.1
  # SQLite для запуска на Windows (разработка на ноутбуке)
  sqflite_common_ffi: ^2.3.4
  # Построение пути к файлу базы данных
  path: ^1.9.0
  # Запоминание входа («Запомнить меня»)
  shared_preferences: ^2.3.0
  # Хеширование паролей (SHA-256)
  crypto: ^3.0.6
  # Форматирование цен и дат (версию подбирает flutter_localizations)
  intl: any

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  google_mlkit_pose_detection: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/products/
    - assets/images/sports/
